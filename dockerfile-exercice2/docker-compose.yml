services:
  quiz-docker:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-docker:secure
    ports:
      - "${HOST_PORT}:3000"
    restart: unless-stopped

    # --- Sécurité ---
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    pids_limit: 100
